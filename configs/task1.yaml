# Task 1 - load an official TinyStories checkpoint and generate stories.
#   python scripts/run_task1.py --config configs/task1.yaml
# Everything here is copied into the run manifest, so a run is replayable.

run_name: task1_baseline
seed: 42
batch_size: 8
output_dir: results/task1

model:
  # Verified GPTNeoForCausalLM, public and ungated. Measured 3,745,984 params
  # total / 398,464 non-embedding. Other sizes: 3M, 8M, 28M, 33M, 1Layer-21M,
  # 2Layers-33M, and the TinyStories-Instruct-* variants.
  model_id: roneneldan/TinyStories-1M
  tokenizer_id: null    # null = the checkpoint's own files (== EleutherAI/gpt-neo-125M)
  revision: null        # pin a commit SHA for a strictly reproducible run
  device: auto          # cuda -> mps -> cpu. Never hardcode cuda.
  dtype: float32        # these checkpoints are float32 and tiny

generation:
  # Task 4 raises num_return_sequences to 10 at temperature 1 for the judge.
  max_new_tokens: 200
  temperature: 1.0
  top_p: 0.95
  top_k: null
  do_sample: true
  repetition_penalty: 1.0
  num_return_sequences: 1

prompts:
  - "Once upon a time, there was a little girl named Lily."
  - "Once upon a time there was"
  - "Tom and Jane were playing in the park when they found a tiny blue key."
